################################################################################
# Php Sdk Container
#
# Where Composer, GrumPHP & PhpUnit are executed against local sources.
################################################################################

services:

    php-8.3:
        image:              registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
        container_name:     php.sellsy.local
        environment:
            # The repository is owned by the host user, not by the container
            # one: let git work on it all the same.
            GIT_CONFIG_COUNT:   "1"
            GIT_CONFIG_KEY_0:   "safe.directory"
            GIT_CONFIG_VALUE_0: "/var/www/html"
        volumes:
            - '${PWD}/:/var/www/html'
            - vendor-php83:/var/www/html/vendor
        networks:
            sellsy:         { aliases: [ php.sellsy.local ] }

volumes:
    vendor-php83: ~
