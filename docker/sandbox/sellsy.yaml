api_platform:
    title:  Sellsy API SandBox

    ########################################################################
    # Api Platform 4 syntax: formats are plain mime type lists
    formats:
        json:   ['application/json']
        html:   ['text/html']

    ########################################################################
    # Pagination moved from collection.pagination to defaults in Api Platform 3
    defaults:
        pagination_client_items_per_page:           true
        pagination_items_per_page_parameter_name:   limit

    ########################################################################
    # Api Platform 4 syntax: api_keys is a map, each entry needs its own key
    swagger:
        api_keys:
            api_user:       { name: "X-API-USER", type: "header" }
            api_token:      { name: "X-API-TOKEN", type: "header" }
            api_version:    { name: "X-API-VERSION", type: "header" }

    ########################################################################
    # Enable CamelCase To SnakeCase Conversion
    name_converter: 'Symfony\Component\Serializer\NameConverter\CamelCaseToSnakeCaseNameConverter'

services:
    ########################################################################
    # Register CamelCase To SnakeCase Conversion
    Symfony\Component\Serializer\NameConverter\CamelCaseToSnakeCaseNameConverter: ~

    ########################################################################
    # ShippingBo Normalizer
    App\Serializer\ApiNormalizer:
        decorates: 'api_platform.serializer.normalizer.item'
        arguments:
            $decorated: '@App\Serializer\ApiNormalizer.inner'