################################################################
# Include Pipeline Templates
include:
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/gitlab/php/defaults.yaml'
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/3.0/gitlab/pages.yaml'

################################################################
# Quality Tests
################################################################

################################################################################
# PHP 8.3 — the only version the Connector supports
quality:php-8.3:
    extends:    .quality
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3

################################################################
# Functional Tests
################################################################

################################################################################
# Complete Test Suite, against the Sellsy Api Sandbox
functional:sellsy:
    extends:    .functional
    image:      registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    needs:
        - job:  docker:sandbox
    services:
        - name:     $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
          alias:    sandbox.sellsy.local
    ################################################################################
    # Run Test Script
    script:
        # Wait for the Sellsy Api Sandbox to Start
        - until curl -sf http://sandbox.sellsy.local/taxes > /dev/null; do sleep 2; done
        # Execute PhpUnit Tests
        - php vendor/bin/phpunit --log-junit $CI_PROJECT_DIR/full-report.xml
